name: Standards Tracker

# Checks IETF Datatracker daily for new revisions of the drafts this PoC
# implements.
#
# Issue creation policy:
#   - An issue is opened ONLY when a tracked standard bumps its revision,
#     an RSS-monitored spec has new activity, or a page-hash spec changes.
#     These require human review and potentially a code/demo PR.
#   - Newly discovered drafts from WG feeds are written into the baseline
#     immediately (status: "discovered") so they are NOT re-reported on
#     subsequent runs.  No issue is opened for discoveries alone.
#
# This keeps the issue tracker signal-to-noise high: one issue per
# meaningful spec change, never a daily discovery-noise flood.

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC every day
  workflow_dispatch:        # allow on-demand runs from the Actions tab

permissions:
  contents: write   # push updated standards-baseline.json
  issues: write     # open tracking issues

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Create label once; --force makes this idempotent
      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "standards-update" \
            --description "IETF/OpenID draft revision changed — review required" \
            --color "0075ca" \
            --force 2>/dev/null || true

      - name: Run standards tracker
        id: tracker
        run: python3 scripts/check_standards.py

      # Commit whenever the baseline file changed — this covers both revision
      # updates AND newly discovered drafts being registered for the first time.
      - name: Commit updated baseline
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add standards-baseline.json
          # Guard: only commit when the file actually changed
          git diff --cached --quiet || \
            git commit -m "chore(standards): update baseline after daily check [skip ci]"
          git push

      - name: Open GitHub issue
        if: steps.tracker.outputs.updates_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "${{ steps.tracker.outputs.issue_title }}" \
            --body-file /tmp/standards_issue_body.md \
            --label "standards-update"
